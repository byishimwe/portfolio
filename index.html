<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f6" />
    <script>
      (() => {
        let saved;
        try {
          saved = localStorage.getItem("portfolio-theme");
        } catch {}
        const theme =
          saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#101010" : "#faf9f6";
      })();
    </script>
    <style>
      html {
        background: #faf9f6;
      }
      html[data-theme="dark"] {
        background: #101010;
        color-scheme: dark;
      }
    </style>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title data-route-meta>
      Prince Arnaud Ishimwe — Designer &amp; Frontend Developer
    </title>
    <meta
      data-route-meta
      name="description"
      content="An independent designer and frontend developer in Rwanda, creating thoughtful websites and digital experiences for businesses and brands."
    />

    <meta
      data-route-meta
